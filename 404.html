<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 - 오렌지 라이브 커머스</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="hd">
  <div class="wrap hd__in">
    <a class="logo" href="/" aria-label="오렌지 라이브 커머스 홈">
      <img class="logo__mark" src="/assets/img/mascot.webp" alt="" width="40" height="40">
      <span class="logo__txt">
        <span class="logo__ko"><em>오렌지</em> 라이브 커머스</span>
        <span class="logo__en">Orange Live On</span>
      </span>
    </a>
  </div>
</header>

<main class="sec">
  <div class="wrap" style="max-width:640px;text-align:center;padding-block:48px">
    <img src="/assets/img/mascot.webp" alt="" width="110" height="110" style="border-radius:50%;margin:0 auto 28px">
    <p class="mono" style="font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--o-600)">404</p>
    <h1 style="font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.04em;margin-top:12px">요청하신 페이지가 없습니다</h1>
    <p style="font-size:16.5px;line-height:1.75;color:var(--ink-2);margin-top:16px">
      주소가 바뀌었거나 편성이 변경된 페이지일 수 있습니다.<br>아래에서 원하시는 곳으로 이동해 주세요.
    </p>
    <div class="btn-row mt-32" style="justify-content:center">
      <a class="btn btn--primary" href="/">홈으로</a>
      <a class="btn btn--line" href="/schedule">편성표 보기</a>
      <a class="btn btn--line" href="/support">고객지원</a>
    </div>
  </div>
</main>

</body>
</html>
